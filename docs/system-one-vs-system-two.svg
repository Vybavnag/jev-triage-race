<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"
     role="img" aria-label="The same ticket goes to both sides. Jev evaluates three typed questions in parallel and returns a probability for each, which code can branch on directly. The LLM generates one structured object asserting a single answer per field.">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#55606D"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#EEF1F4"/>

  <!-- Shared input -->
  <rect x="24" y="186" width="196" height="96" rx="3" fill="#F8FAFB" stroke="#D3DAE1"/>
  <text x="40" y="210" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#141A22">Same ticket</text>
  <text x="40" y="232" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">“Stripe has been failing</text>
  <text x="40" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">for 3 days, I'm losing</text>
  <text x="40" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">sales. Help ASAP.”</text>

  <line x1="224" y1="210" x2="286" y2="150" stroke="#55606D" stroke-width="1.4" marker-end="url(#b)"/>
  <line x1="224" y1="258" x2="286" y2="322" stroke="#55606D" stroke-width="1.4" marker-end="url(#b)"/>

  <!-- ── Jev side ───────────────────────────────────────────────────── -->
  <rect x="290" y="30" width="580" height="196" rx="4" fill="#F8FAFB" stroke="#0E7C86" stroke-width="1.5"/>
  <text x="308" y="56" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#0E7C86">Jev · classifier</text>
  <text x="418" y="56" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">three typed questions, evaluated in parallel, one request</text>

  <!-- question rows with distributions -->
  <text x="308" y="88" font-family="ui-monospace, monospace" font-size="11" fill="#141A22">is_urgent</text>
  <text x="308" y="103" font-family="system-ui, sans-serif" font-size="10.5" fill="#55606D">noul</text>
  <rect x="404" y="76" width="300" height="14" rx="2" fill="#B6DDE1"/>
  <rect x="404" y="76" width="291" height="14" rx="2" fill="#0E7C86"/>
  <text x="716" y="88" font-family="ui-monospace, monospace" font-size="11.5" fill="#0E7C86">0.97</text>

  <text x="308" y="130" font-family="ui-monospace, monospace" font-size="11" fill="#141A22">team</text>
  <text x="308" y="145" font-family="system-ui, sans-serif" font-size="10.5" fill="#55606D">choice</text>
  <rect x="404" y="118" width="300" height="14" rx="2" fill="#B6DDE1"/>
  <rect x="404" y="118" width="228" height="14" rx="2" fill="#0E7C86"/>
  <text x="716" y="130" font-family="ui-monospace, monospace" font-size="11.5" fill="#0E7C86">technical</text>
  <text x="410" y="129" font-family="ui-monospace, monospace" font-size="9.5" fill="#FFFFFF">technical .76</text>
  <text x="640" y="129" font-family="ui-monospace, monospace" font-size="9.5" fill="#0E7C86">billing .19</text>

  <text x="308" y="172" font-family="ui-monospace, monospace" font-size="11" fill="#141A22">frustration</text>
  <text x="308" y="187" font-family="system-ui, sans-serif" font-size="10.5" fill="#55606D">score</text>
  <rect x="404" y="160" width="300" height="14" rx="2" fill="#B6DDE1"/>
  <rect x="404" y="160" width="222" height="14" rx="2" fill="#0E7C86"/>
  <text x="716" y="172" font-family="ui-monospace, monospace" font-size="11.5" fill="#0E7C86">2.9 / 4</text>

  <text x="308" y="210" font-family="system-ui, sans-serif" font-size="11.5" fill="#141A22">Output is a distribution, so code can branch on confidence.</text>

  <!-- ── LLM side ───────────────────────────────────────────────────── -->
  <rect x="290" y="252" width="580" height="180" rx="4" fill="#F8FAFB" stroke="#5B3FA8" stroke-width="1.5"/>
  <text x="308" y="278" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#5B3FA8">LLM · generator</text>
  <text x="440" y="278" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">one structured call, tokens generated in sequence</text>

  <rect x="308" y="294" width="360" height="106" rx="3" fill="#FFFFFF" stroke="#CEC4EC"/>
  <text x="324" y="316" font-family="ui-monospace, monospace" font-size="11.5" fill="#141A22">{</text>
  <text x="340" y="334" font-family="ui-monospace, monospace" font-size="11.5" fill="#141A22">"urgent": true,</text>
  <text x="340" y="352" font-family="ui-monospace, monospace" font-size="11.5" fill="#141A22">"team": "technical",</text>
  <text x="340" y="370" font-family="ui-monospace, monospace" font-size="11.5" fill="#141A22">"frustration": 4</text>
  <text x="324" y="388" font-family="ui-monospace, monospace" font-size="11.5" fill="#141A22">}</text>

  <text x="690" y="330" font-family="system-ui, sans-serif" font-size="11.5" fill="#141A22">One answer per</text>
  <text x="690" y="346" font-family="system-ui, sans-serif" font-size="11.5" fill="#141A22">field, asserted.</text>
  <text x="690" y="368" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">No confidence to</text>
  <text x="690" y="384" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">route or defer on.</text>

  <text x="24" y="452" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">Both sides answer the same three questions and are graded against the same labels. The difference measured is what each returns.</text>
</svg>
