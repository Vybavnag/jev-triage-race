<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490"
     role="img" aria-label="The browser holds no API keys: it posts a race request and receives results over Server-Sent Events, while the server runs two independently rate-limited lanes that call the Jev and LLM APIs.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#141A22"/>
    </marker>
    <marker id="aj" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/>
    </marker>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B3FA8"/>
    </marker>
  </defs>

  <rect width="900" height="490" fill="#EEF1F4"/>

  <!-- Browser -->
  <rect x="24" y="81" width="140" height="84" rx="3" fill="#F8FAFB" stroke="#D3DAE1"/>
  <text x="94" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#141A22">Browser</text>
  <text x="94" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">picks from an</text>
  <text x="94" y="147" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">allowlist only</text>

  <!-- Server boundary -->
  <rect x="262" y="36" width="338" height="416" rx="4" fill="none" stroke="#141A22" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="280" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141A22">Container</text>
  <text x="280" y="75" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">the only place API keys exist</text>

  <!-- Routes -->
  <rect x="280" y="92" width="302" height="62" rx="3" fill="#F8FAFB" stroke="#D3DAE1"/>
  <text x="431" y="117" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141A22">Routes and SSE stream</text>
  <text x="431" y="137" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">token gate, size cap, one race at a time</text>

  <!-- Orchestrator -->
  <rect x="280" y="172" width="302" height="164" rx="3" fill="#F8FAFB" stroke="#D3DAE1"/>
  <text x="431" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141A22">Race orchestrator</text>

  <rect x="298" y="208" width="266" height="36" rx="2" fill="#FFFFFF" stroke="#0E7C86"/>
  <text x="312" y="231" font-family="system-ui, sans-serif" font-size="12" fill="#0E7C86">Jev lane</text>
  <text x="550" y="231" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#55606D">8 in flight</text>

  <rect x="298" y="282" width="266" height="36" rx="2" fill="#FFFFFF" stroke="#5B3FA8"/>
  <text x="312" y="305" font-family="system-ui, sans-serif" font-size="12" fill="#5B3FA8">LLM lane</text>
  <text x="550" y="305" text-anchor="end" font-family="ui-monospace, monospace" font-size="11" fill="#55606D">4 in flight</text>

  <!-- Scoring -->
  <rect x="280" y="356" width="302" height="82" rx="3" fill="#F8FAFB" stroke="#D3DAE1"/>
  <text x="431" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#141A22">Scoring and pricing</text>
  <text x="431" y="402" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">grades against bundled labels;</text>
  <text x="431" y="419" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#55606D">errors stay out of the denominator</text>

  <!-- Providers -->
  <rect x="730" y="196" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#0E7C86" stroke-width="1.5"/>
  <text x="805" y="221" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0E7C86">Jev</text>
  <text x="805" y="240" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10.5" fill="#55606D">api.typesafe.ai</text>

  <rect x="730" y="270" width="150" height="60" rx="3" fill="#FFFFFF" stroke="#5B3FA8" stroke-width="1.5"/>
  <text x="805" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B3FA8">LLM</text>
  <text x="805" y="314" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#55606D">Claude or compatible</text>

  <!-- Browser <-> routes -->
  <line x1="168" y1="110" x2="276" y2="110" stroke="#141A22" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="212" y="102" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#141A22">POST /api/race</text>

  <line x1="276" y1="138" x2="168" y2="138" stroke="#141A22" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="212" y="154" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#141A22">SSE result, done</text>

  <!-- Lanes -> providers -->
  <line x1="568" y1="226" x2="726" y2="226" stroke="#0E7C86" stroke-width="1.6" marker-end="url(#aj)"/>
  <text x="647" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#0E7C86">3 questions, 1 call</text>

  <line x1="568" y1="300" x2="726" y2="300" stroke="#5B3FA8" stroke-width="1.6" marker-end="url(#al)"/>
  <text x="647" y="292" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#5B3FA8">1 structured call</text>

  <!-- Internal flow -->
  <line x1="431" y1="158" x2="431" y2="168" stroke="#141A22" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="431" y1="340" x2="431" y2="352" stroke="#141A22" stroke-width="1.2" marker-end="url(#a)"/>

  <text x="24" y="474" font-family="system-ui, sans-serif" font-size="11.5" fill="#55606D">A client can only name a model the server already allows; base URLs, prices, and keys are never accepted from the browser.</text>
</svg>
